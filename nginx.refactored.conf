worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 15s;
    keepalive_requests 1000;
    client_max_body_size 20m;
    server_tokens off;

    log_format custom_format '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" "$http_x_forwarded_for" '
                             'rt=$request_time urt=$upstream_response_time '
                             'to: $upstream_addr';

    access_log /var/log/nginx/access.log custom_format;
    error_log  /var/log/nginx/error.log warn;

    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";

    upstream web_api {
        server app:5001;
        keepalive 64;
    }

    upstream web_ui {
        server ui:80;
        keepalive 32;
    }

    upstream pos_notify {
        server notify:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name api-pos.pharmacity.vn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name api-pos.pharmacity.vn;

        ssl_certificate     /etc/letsencrypt/live/api-pos.pharmacity.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api-pos.pharmacity.vn/privkey.pem;

        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
        }

        location = /swagger {
            return 301 /swagger/;
        }

        location /swagger/ {
            proxy_pass http://web_api/swagger/;
        }

        location /webapi/ {
            proxy_pass http://web_api/;
        }

        location /ui/ {
            proxy_pass http://web_ui/;
        }

        location /api/pos/ {
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://web_api/api/customer/search/;
        }

        location /api/vnpay/ {
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://web_api/api/vnpay/;
        }

        location /api/v3/vnpay/ {
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://web_api/api/v3/vnpayv3/;
        }

        location /notify/ {
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://pos_notify/notify/;
        }

        location /health-profile/remind-medicine/ {
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://pos_notify/medicineremind/;
            chunked_transfer_encoding on;
        }

        location /webhook/api/transaction {
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://pos_notify/webhook/api/transaction;
        }

        location /webhook/api/transactionasync {
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://pos_notify/webhook/api/transactionasync;
        }

        location / {
            proxy_pass http://web_api/;
        }
    }
}
