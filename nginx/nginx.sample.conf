# ------------------------------------------------------------------
# Nginx Production-Ready Config Template
# ------------------------------------------------------------------
# File nay la config mau day du, da ap dung tat ca best practices
# tu bo tai lieu nginx/.
#
# Su dung: copy file nay, thay cac gia tri YOUR_DOMAIN, upstream,
# va cert paths cho phu hop voi moi truong cua ban.
# ------------------------------------------------------------------

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Security ----
    server_tokens off;

    # ---- Performance ----
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 15s;
    keepalive_requests 1000;
    client_max_body_size 20m;

    # ---- Gzip ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- Logging ----
    log_format custom_format '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" "$http_x_forwarded_for" '
                             'rt=$request_time '
                             'uct=$upstream_connect_time '
                             'uht=$upstream_header_time '
                             'urt=$upstream_response_time '
                             'to: $upstream_addr';

    access_log /var/log/nginx/access.log custom_format;
    error_log  /var/log/nginx/error.log warn;

    # ---- Proxy defaults (ap dung cho tat ca location) ----
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";

    # ---- Buffer ----
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # ---- Rate limiting ----
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # ---- Security headers (ap dung chung) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Upstreams ----
    upstream web_api {
        server app:5001;
        keepalive 64;
    }

    upstream web_ui {
        server ui:80;
        keepalive 32;
    }

    upstream pos_notify {
        server notify:8080;
        keepalive 32;
    }

    # ---- Default server: chan request khong khop domain ----
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # ---- HTTP: redirect sang HTTPS + ACME challenge ----
    server {
        listen 80;
        server_name YOUR_DOMAIN;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS: main server ----
    server {
        listen 443 ssl http2;
        server_name YOUR_DOMAIN;

        # ---- SSL ----
        ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;

        # HSTS (chi bat khi HTTPS da chay on dinh)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ---- Monitoring ----
        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
        }

        # ---- Swagger ----
        location = /swagger {
            return 301 /swagger/;
        }

        location /swagger/ {
            proxy_pass http://web_api/swagger/;
        }

        # ---- Web API ----
        location /webapi/ {
            proxy_pass http://web_api/;
        }

        # ---- Frontend UI ----
        location /ui/ {
            proxy_pass http://web_ui/;
        }

        # ---- API endpoints (voi auth header) ----
        location /api/pos/ {
            proxy_set_header Authorization $http_authorization;
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://web_api/api/customer/search/;
        }

        location /api/vnpay/ {
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://web_api/api/vnpay/;
        }

        location /api/v3/vnpay/ {
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://web_api/api/v3/vnpayv3/;
        }

        # ---- Notification service ----
        location /notify/ {
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://pos_notify/notify/;
        }

        location /health-profile/remind-medicine/ {
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://pos_notify/medicineremind/;
            chunked_transfer_encoding on;
        }

        # ---- Webhooks ----
        location /webhook/api/transaction {
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://pos_notify/webhook/api/transaction;
        }

        location /webhook/api/transactionasync {
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://pos_notify/webhook/api/transactionasync;
        }

        # ---- Catch-all ----
        location / {
            proxy_pass http://web_api/;
        }
    }
}
