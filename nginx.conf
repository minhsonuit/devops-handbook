worker_processes auto;

events
{
	worker_connections 2024;
}
#sss
http
{
	log_format custom_format '$remote_addr - $remote_user [$time_local] "$request" '
	'$status $body_bytes_sent "$http_referer" '
	'"$http_user_agent" "$http_x_forwarded_for" '
	'rt=$request_time '
	'uct=$upstream_connect_time '
	'uht=$upstream_header_time '
	'urt=$upstream_response_time '
	'to: $upstream_addr';

	access_log /var/log/nginx/access.log custom_format;

	sendfile on;

	upstream web-api
	{
		server app:5001;
		keepalive 32;
	}
	upstream web-ui
	{
		server 10.1.1.176:8000;
		keepalive 32;
	}
	upstream pos-notify
	{
		server notify:8080;
		keepalive 32;
	}

	server
	{
		listen 80;
		server_name localhost api-pos.pharmacity.vn;
		location /.well-known/acme-challenge/
		{
			root /var/www/certbot;
		}

		location /
		{
			return 301 https://$host$request_uri;
		}

		location /nginx_status
		{
			stub_status;
		}
		location /swagger/
		{
			proxy_pass http://web-api/swagger/;
		}
		location /webapi/
		{
			proxy_pass http://web-api/;
			proxy_redirect off;
			proxy_http_version 1.1;
			proxy_cache_bypass $http_upgrade;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection keep-alive;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host $server_name;
			proxy_set_header Connection "";
		}

		location /ui/
		{
			proxy_pass http://web-ui/ui/;
			proxy_redirect off;
			proxy_http_version 1.1;
			proxy_cache_bypass $http_upgrade;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection keep-alive;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host $server_name;
			proxy_set_header Connection "";
		}
		location /app/ {
			allow 10.1.0.0/16;
			allow 10.2.0.0/16;
			allow all;
			proxy_pass http://web-ui/app/;
			proxy_redirect off;
			proxy_http_version 1.1;
			proxy_cache_bypass $http_upgrade;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection keep-alive;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host $server_name;
			proxy_set_header Connection "";
		}
		
		location /api/pos/
		{
			proxy_pass http://web-api/api/customer/search/;
			proxy_redirect off;
			proxy_http_version 1.1;
			proxy_cache_bypass $http_upgrade;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection keep-alive;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host $server_name;
			proxy_set_header Connection "";
			proxy_set_header Authorization $http_authorization;
			proxy_pass_header Authorization;
		}
		location /notify/
		{
			proxy_pass http://pos-notify/notify/;
			proxy_redirect off;
			proxy_http_version 1.1;
			proxy_cache_bypass $http_upgrade;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection keep-alive;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host $server_name;
			proxy_set_header Connection "";
			proxy_set_header Authorization $http_authorization;
			proxy_pass_header Authorization;
		}
		location /health-profile/remind-medicine/
		{
			proxy_pass http://pos-notify/medicineremind/;
			proxy_redirect off;
			proxy_http_version 1.1;
			proxy_cache_bypass $http_upgrade;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection keep-alive;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host $server_name;
			proxy_set_header Connection "";
			proxy_set_header Authorization $http_authorization;
			proxy_pass_header Authorization;
			chunked_transfer_encoding on;


		}
		location /webhook/api/transaction
		{
			proxy_pass http://pos-notify/webhook/api/transaction;
			proxy_redirect off;
			proxy_http_version 1.1;
			proxy_cache_bypass $http_upgrade;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection keep-alive;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host $server_name;
			proxy_set_header Connection "";
			proxy_set_header Authorization $http_authorization;
			proxy_pass_header Authorization;
		}
		location /webhook/api/transactionasync
		{
			proxy_pass http://pos-notify/webhook/api/transactionasync;
			proxy_redirect off;
			proxy_http_version 1.1;
			proxy_cache_bypass $http_upgrade;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection keep-alive;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host $server_name;
			proxy_set_header Connection "";
			proxy_set_header Authorization $http_authorization;
			proxy_pass_header Authorization;
		}

	}

